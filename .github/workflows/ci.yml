name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here needs write access to the repository.
permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: macos-15

    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Select toolchain
        # swift-testing requires Xcode 16 or newer. Pick the newest Xcode the
        # runner image provides rather than pinning a version that image
        # updates will eventually remove.
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "${newest}" ]; then
            echo "Selecting ${newest}"
            sudo xcode-select -s "${newest}/Contents/Developer"
          fi

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Check release metadata
        run: |
          for field in codexDesktopVersion codexBundleIdentifier macos architecture verifiedOn; do
            value="$(plutil -extract "${field}" raw -o - tested-with.json)"
            [ -n "${value}" ] || { echo "::error::tested-with.json is missing ${field}"; exit 1; }
            printf "  ok    %-24s %s\n" "${field}" "${value}"
          done


      - name: Check the tested Codex version
        run: ./scripts/check-tested-version.sh

      - name: Check the knowledge base
        run: ./scripts/check-knowledge.sh

      - name: Run unit tests
        run: ./scripts/test.sh

      - name: Build app bundle
        run: ./scripts/build.sh

      - name: Validate app bundle
        run: ./scripts/validate-bundle.sh "dist/Codex the 2nd.app"

      - name: Verify universal binary
        run: |
          archs="$(lipo -archs "dist/Codex the 2nd.app/Contents/MacOS/CodexTheSecond")"
          echo "Architectures: ${archs}"
          for expected in arm64 x86_64; do
            case " ${archs} " in
              *" ${expected} "*) ;;
              *) echo "::error::missing ${expected} slice"; exit 1 ;;
            esac
          done

      - name: Smoke-test the c2nd command
        # No Codex and no installed launcher on a runner, so this checks the
        # paths that must still behave: reporting nothing installed, and
        # refusing an unknown command.
        run: |
          CLI="dist/Codex the 2nd.app/Contents/MacOS/c2nd"
          "$CLI" version
          "$CLI" list | tee /tmp/list.txt
          grep -q "No profile launchers installed" /tmp/list.txt
          "$CLI" help > /dev/null
          if "$CLI" not-a-command 2>/dev/null; then
            echo "::error::c2nd accepted an unknown command"; exit 1
          fi
          echo "c2nd smoke test passed"

      - name: Build every other profile
        # Profiles are configuration, so every shipped one must still build.
        run: |
          for profile in profiles/*.json; do
            slug="$(basename "${profile}" .json)"
            # `[ ... ] && continue` returns non-zero when the test is false,
            # which `bash -e` treats as a failure. Use a plain if.
            if [ "${slug}" = "2nd" ]; then
              continue
            fi
            ./scripts/build.sh --profile "${slug}" --output dist-check
          done

      - name: Package artifacts
        run: ./scripts/package.sh --skip-build

      - name: Upload build output
        uses: actions/upload-artifact@v4.4.3
        with:
          name: codex-the-second-ci
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 7
