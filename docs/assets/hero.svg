<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="The 2nd Codex - run a second Codex account alongside your normal one">
  <title>The 2nd Codex</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E0E16"/>
      <stop offset="1" stop-color="#07070C"/>
    </linearGradient>
    <linearGradient id="plateA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A4A5C"/>
      <stop offset="1" stop-color="#23232E"/>
    </linearGradient>
    <linearGradient id="plateB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#2A1B6B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7C5CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .sans  { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 2.6px; fill: #6F6F8A; }
    .title   { font-size: 46px; font-weight: 700; fill: #F4F4F8; letter-spacing: -0.8px; }
    .sub     { font-size: 18px; fill: #9C9CB4; }
    .card-t  { font-size: 20px; font-weight: 650; fill: #F4F4F8; }
    .card-s  { font-size: 14px; fill: #8B8BA6; }
    .path    { font-size: 13px; fill: #C3C3D8; }
    .badge   { font-size: 12px; font-weight: 600; letter-spacing: 1.4px; fill: #8D7CFF; }
    .foot    { font-size: 14px; fill: #7E7E99; }
    .mono-ic { font-size: 23px; font-weight: 700; fill: #FFFFFF; }
  </style>

  <rect width="1200" height="470" rx="22" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="469" rx="21.5" fill="none" stroke="#1E1E2B"/>
  <rect x="300" y="0" width="600" height="1.5" fill="url(#glow)"/>

  <!-- Header -->
  <text class="sans eyebrow" x="600" y="66" text-anchor="middle">MACOS  ·  OPEN SOURCE  ·  MIT</text>
  <text class="sans title"   x="600" y="118" text-anchor="middle">The 2nd Codex</text>
  <text class="sans sub"     x="600" y="152" text-anchor="middle">Two Codex accounts. Side by side. At the same time.</text>

  <!-- Left card: the Codex you already have -->
  <g>
    <rect x="70" y="196" width="440" height="196" rx="16" fill="#13131C" stroke="#242433"/>
    <rect x="102" y="228" width="64" height="64" rx="15" fill="url(#plateA)"/>
    <rect x="103.5" y="229.5" width="61" height="61" rx="13.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text class="mono mono-ic" x="134" y="268" text-anchor="middle" dominant-baseline="middle">C</text>

    <text class="sans card-t" x="186" y="250">Codex.app</text>
    <text class="sans card-s" x="186" y="275">Your existing install · Account A</text>

    <rect x="102" y="318" width="376" height="42" rx="10" fill="#0A0A11" stroke="#22222F"/>
    <text class="mono path" x="120" y="344">~/.codex</text>
    <text class="sans card-s" x="458" y="344" text-anchor="end">untouched</text>
  </g>

  <!-- Divider -->
  <g>
    <line x1="600" y1="210" x2="600" y2="262" stroke="#2A2A3A" stroke-width="1.5" stroke-dasharray="4 6"/>
    <line x1="600" y1="326" x2="600" y2="378" stroke="#2A2A3A" stroke-width="1.5" stroke-dasharray="4 6"/>
    <rect x="547" y="272" width="106" height="44" rx="12" fill="#14101F" stroke="#3A2E6B"/>
    <text class="sans badge" x="600" y="291" text-anchor="middle">FULLY</text>
    <text class="sans badge" x="600" y="307" text-anchor="middle">ISOLATED</text>
  </g>

  <!-- Right card: the second profile -->
  <g>
    <rect x="690" y="196" width="440" height="196" rx="16" fill="#15121F" stroke="#3A2E6B"/>
    <rect x="722" y="228" width="64" height="64" rx="15" fill="url(#plateB)"/>
    <rect x="723.5" y="229.5" width="61" height="61" rx="13.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <text class="sans mono-ic" x="754" y="268" text-anchor="middle" dominant-baseline="middle">CP</text>

    <text class="sans card-t" x="806" y="250">Codex Personal.app</text>
    <text class="sans card-s" x="806" y="275">This launcher · Account B</text>

    <rect x="722" y="318" width="376" height="42" rx="10" fill="#0C0918" stroke="#2E2551"/>
    <text class="mono path" x="740" y="344">~/.codex-personal</text>
    <text class="sans card-s" x="1078" y="344" text-anchor="end">created for you</text>
  </g>

  <!-- Footer -->
  <text class="sans foot" x="600" y="434" text-anchor="middle">Separate logins · Separate sessions · Quit one, the other keeps running</text>
</svg>
