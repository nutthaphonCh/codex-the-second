    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .eyebrow { font-size: 12.5px; font-weight: 600; letter-spacing: 3.4px; fill: #8B84B8; }
    .title   { font-size: 52px; font-weight: 700; fill: #FFFFFF; letter-spacing: -1.2px; }
    .sub     { font-size: 18px; fill: #A9A6C8; }
    .app     { font-size: 19px; font-weight: 650; fill: #F3F1FF; }
    .path    { font-size: 13.5px; fill: #D6D2F2; }
    .note    { font-size: 12.5px; letter-spacing: 1.5px; font-weight: 600; }
    .badge   { font-size: 11.5px; font-weight: 700; letter-spacing: 1.8px; fill: #C4B4FF; }
    .foot    { font-size: 14px; fill: #7F7AA3; }
    .glyph   { font-size: 25px; font-weight: 700; fill: #FFFFFF; }
  </style>

