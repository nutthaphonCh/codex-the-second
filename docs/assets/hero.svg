<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Codex the 2nd - two Codex accounts running side by side in separate, isolated profiles">
  <title>Codex the 2nd</title>

  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#090615"/>
      <stop offset="0.55" stop-color="#0C0820"/>
      <stop offset="1" stop-color="#050409"/>
    </linearGradient>

    <radialGradient id="nebulaA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#5B3FD6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5B3FD6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2E7FE8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2E7FE8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="titleGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Left world: the Codex you already have -->
    <radialGradient id="worldA" cx="0.34" cy="0.28" r="0.82">
      <stop offset="0" stop-color="#8E93AD"/>
      <stop offset="0.42" stop-color="#4A4F68"/>
      <stop offset="0.78" stop-color="#252938"/>
      <stop offset="1" stop-color="#111320"/>
    </radialGradient>
    <radialGradient id="haloA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#8E93AD" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#8E93AD" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8E93AD" stop-opacity="0"/>
    </radialGradient>

    <!-- Right world: the second profile -->
    <radialGradient id="worldB" cx="0.34" cy="0.28" r="0.82">
      <stop offset="0" stop-color="#C9B6FF"/>
      <stop offset="0.36" stop-color="#8A6BFF"/>
      <stop offset="0.72" stop-color="#4B2FB0"/>
      <stop offset="1" stop-color="#1E1247"/>
    </radialGradient>
    <radialGradient id="haloB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.45" stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#7C5CFF" stop-opacity="0.42"/>
      <stop offset="0.80" stop-color="#7C5CFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.75"/>
    </linearGradient>

    <clipPath id="frame"><rect width="1200" height="560" rx="22"/></clipPath>
  </defs>

